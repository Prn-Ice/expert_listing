name: app_ui
description: Expert Listing design system — semantic tokens, themes, and shared controls.
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.13.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.3.0

flutter:
  assets:
    - assets/icons/
  fonts:
    - family: Open Runde
      fonts:
        - asset: assets/fonts/open_runde/OpenRunde-Regular.otf
          weight: 400
        - asset: assets/fonts/open_runde/OpenRunde-Medium.otf
          weight: 500
        - asset: assets/fonts/open_runde/OpenRunde-Semibold.otf
          weight: 600
        - asset: assets/fonts/open_runde/OpenRunde-Bold.otf
          weight: 700
