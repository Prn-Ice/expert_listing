name: Release

on:
  push:
    tags: ["v0.1.0"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-gate:
    name: Required release checks
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish release
    needs: release-gate
    runs-on: ubuntu-latest
    environment: android-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
      - name: Verify tag, application version and release notes
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pubspec_version="$(sed -n 's/^version: \([0-9][^+]*\).*/\1/p' apps/expert_listing_mobile/pubspec.yaml | head -1)"
          release_notes="docs/releases/${GITHUB_REF_NAME}.md"
          echo "Tag version: $tag_version"
          echo "pubspec version: $pubspec_version"
          if [ -z "$pubspec_version" ] || [ "$tag_version" != "$pubspec_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the application version $pubspec_version."
            exit 1
          fi
          if [ ! -f "$release_notes" ]; then
            echo "::error::$release_notes must be committed before tagging; it is the release body."
            exit 1
          fi
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Restore the committed mobile dependency graph
        run: flutter pub get --enforce-lockfile
        working-directory: apps/expert_listing_mobile
      - name: Reconstruct release signing material in runner-temporary storage
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for credential in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!credential}" ]; then
              echo "::error::$credential is required."
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/expert-listing-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > "$keystore"
          {
            printf 'storeFile=%s\n' "$keystore"
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > apps/expert_listing_mobile/android/key.properties
          keytool -list -keystore "$keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" > /dev/null
      - name: Build the universal release APK against the deployed API
        env:
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
        run: |
          expected_api_url='https://chvhwausefhvaceygppc.supabase.co/functions/v1/api'
          if [ "$PUBLIC_API_BASE_URL" != "$expected_api_url" ]; then
            echo "::error::PUBLIC_API_BASE_URL must equal $expected_api_url for a release build."
            exit 1
          fi
          flutter build apk --release --dart-define=API_BASE_URL="$PUBLIC_API_BASE_URL"
        working-directory: apps/expert_listing_mobile
      - name: Verify the APK is signed by the release keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          if [ -z "$apksigner" ]; then
            echo "::error::Could not find apksigner in the Android build tools."
            exit 1
          fi
          apk="apps/expert_listing_mobile/build/app/outputs/flutter-apk/app-release.apk"
          "$apksigner" verify "$apk"
          actual="$("$apksigner" verify --print-certs "$apk" \
            | sed -n 's/.*SHA-256 digest: //p' | head -1 | tr -d ' :' | tr 'A-F' 'a-f')"
          expected="$(keytool -list -v \
            -keystore "$RUNNER_TEMP/expert-listing-release.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            | sed -n 's/.*SHA256: //p' | head -1 | tr -d ' :' | tr 'A-F' 'a-f')"
          echo "APK signer SHA-256: $actual"
          echo "Release keystore SHA-256: $expected"
          test -n "$actual" && test "$actual" = "$expected"
      - name: Stage the named APK and checksum
        run: |
          apk="apps/expert_listing_mobile/build/app/outputs/flutter-apk/app-release.apk"
          artifact="expert-listing-${GITHUB_REF_NAME}-android.apk"
          cp "$apk" "$RUNNER_TEMP/$artifact"
          (
            cd "$RUNNER_TEMP"
            sha256sum "$artifact" > SHA256SUMS.txt
            cat SHA256SUMS.txt
          )
      - name: Create the GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/expert-listing-${GITHUB_REF_NAME}-android.apk" \
            "$RUNNER_TEMP/SHA256SUMS.txt" \
            --title "Expert Listing $GITHUB_REF_NAME" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
      - name: Remove release signing material
        if: ${{ always() }}
        run: rm -f apps/expert_listing_mobile/android/key.properties "$RUNNER_TEMP/expert-listing-release.jks"
