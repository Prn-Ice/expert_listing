name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Verify tag, application version and release notes
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pubspec_version="$(sed -n 's/^version: \([0-9][^+]*\).*/\1/p' apps/expert_listing_mobile/pubspec.yaml | head -1)"
          echo "Tag version: $tag_version"
          echo "pubspec version: $pubspec_version"
          if [ -z "$pubspec_version" ] || [ "$tag_version" != "$pubspec_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the application version $pubspec_version."
            exit 1
          fi
          if [ ! -f docs/releases/v0.1.0.md ]; then
            echo "::error::docs/releases/v0.1.0.md must be committed before tagging; it is the release body."
            exit 1
          fi

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.5
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.111.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Restore committed dependency graph
        run: flutter pub get
        working-directory: packages/app_ui
      - name: Restore mobile dependency graph
        run: flutter pub get
        working-directory: apps/expert_listing_mobile

      - name: Verify mobile formatting
        run: dart format --output=none --set-exit-if-changed .
        working-directory: apps/expert_listing_mobile
      - name: Verify app_ui formatting
        run: dart format --output=none --set-exit-if-changed .
        working-directory: packages/app_ui
      - name: Analyze app_ui
        run: flutter analyze
        working-directory: packages/app_ui
      - name: Analyze mobile
        run: flutter analyze
        working-directory: apps/expert_listing_mobile
      - name: Run app_ui tests
        run: flutter test
        working-directory: packages/app_ui
      - name: Run mobile tests
        run: flutter test
        working-directory: apps/expert_listing_mobile

      - name: Check Deno formatting
        run: deno fmt --check supabase/functions
      - name: Lint Hono functions
        run: deno lint supabase/functions
      - name: Type-check Hono functions
        run: deno check index.ts tests/health_test.ts tests/feed_test.ts
        working-directory: supabase/functions/api
      - name: Apply migrations, deterministic seed and bucket fixtures
        run: |
          supabase start
          supabase db reset --local
          supabase seed buckets --local
      - name: Run pgTAP tests
        run: supabase test db --local
      - name: Run Hono API tests against the real local stack
        run: scripts/run-api-tests

      - name: Reconstruct the release keystore in runner-temporary storage
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/expert-listing-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > "$keystore"
          {
            echo "storeFile=$keystore"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > apps/expert_listing_mobile/android/key.properties
          keytool -list -keystore "$keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" > /dev/null

      - name: Build the universal release APK against the deployed API
        working-directory: apps/expert_listing_mobile
        env:
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
        run: |
          case "$PUBLIC_API_BASE_URL" in
            https://*/functions/v1/api) ;;
            *)
              echo "::error::Set the PUBLIC_API_BASE_URL repository variable to the deployed HTTPS Hono URL ending with /functions/v1/api."
              exit 1
              ;;
          esac
          flutter build apk --release --dart-define=API_BASE_URL="$PUBLIC_API_BASE_URL"

      - name: Verify the APK is signed by the release keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          apk="apps/expert_listing_mobile/build/app/outputs/flutter-apk/app-release.apk"
          "$apksigner" verify "$apk"
          actual="$("$apksigner" verify --print-certs "$apk" \
            | sed -n 's/.*SHA-256 digest: //p' | head -1 | tr -d ' :' | tr 'A-F' 'a-f')"
          expected="$(keytool -list -v \
            -keystore "$RUNNER_TEMP/expert-listing-release.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            | sed -n 's/.*SHA256: //p' | head -1 | tr -d ' :' | tr 'A-F' 'a-f')"
          echo "APK signer SHA-256: $actual"
          echo "Release keystore SHA-256: $expected"
          test -n "$actual" && test "$actual" = "$expected"

      - name: Stage the named APK and checksum
        run: |
          apk="apps/expert_listing_mobile/build/app/outputs/flutter-apk/app-release.apk"
          artifact="expert-listing-${GITHUB_REF_NAME}-android.apk"
          cp "$apk" "$RUNNER_TEMP/$artifact"
          (
            cd "$RUNNER_TEMP"
            sha256sum "$artifact" > SHA256SUMS.txt
            cat SHA256SUMS.txt
          )

      - name: Create the GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/expert-listing-${GITHUB_REF_NAME}-android.apk" \
            "$RUNNER_TEMP/SHA256SUMS.txt" \
            --title "Expert Listing $GITHUB_REF_NAME" \
            --notes-file docs/releases/v0.1.0.md
