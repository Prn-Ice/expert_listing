name: TestFlight

on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-gate:
    name: Required release checks
    uses: ./.github/workflows/ci.yml

  upload:
    name: Build and upload iOS build to TestFlight
    needs: release-gate
    runs-on: macos-26
    environment: testflight
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Verify the selected Xcode
        run: xcodebuild -version
      - name: Restore the committed app_ui dependency graph
        run: flutter pub get --enforce-lockfile
        working-directory: packages/app_ui
      - name: Restore the committed mobile dependency graph
        run: flutter pub get --enforce-lockfile
        working-directory: apps/expert_listing_mobile
      - name: Install the App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_STORE_CONNECT_KEY_ID" ] || [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] || [ -z "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            echo "::error::APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID and APP_STORE_CONNECT_PRIVATE_KEY are required."
            exit 1
          fi
          api_keys_dir="$RUNNER_TEMP/app-store-connect-private-keys"
          mkdir -p "$api_keys_dir"
          api_key="$api_keys_dir/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$api_key"
          chmod 600 "$api_key"
          if ! grep -q -- '-----BEGIN PRIVATE KEY-----' "$api_key"; then
            echo "::error::APP_STORE_CONNECT_PRIVATE_KEY must contain the downloaded .p8 key."
            exit 1
          fi
      - name: Install manual iOS signing credentials
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          for credential in APPLE_TEAM_ID IOS_DISTRIBUTION_CERTIFICATE_BASE64 IOS_DISTRIBUTION_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64; do
            if [ -z "${!credential}" ]; then
              echo "::error::$credential is required."
              exit 1
            fi
          done
          certificate="$RUNNER_TEMP/ios-distribution.p12"
          profile="$RUNNER_TEMP/appstore.mobileprovision"
          profile_plist="$RUNNER_TEMP/appstore-profile.plist"
          keychain="$RUNNER_TEMP/expert-listing-testflight.keychain-db"
          original_keychains="$RUNNER_TEMP/ios-original-keychains.txt"
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | tr -d '\r\n' | base64 --decode > "$certificate"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | tr -d '\r\n' | base64 --decode > "$profile"
          security list-keychains -d user > "$original_keychains"
          keychain_password="$(openssl rand -hex 32)"
          security create-keychain -p "$keychain_password" "$keychain" > /dev/null
          keychain_paths=()
          while IFS= read -r keychain_path; do
            keychain_paths+=("${keychain_path//\"/}")
          done < "$original_keychains"
          security list-keychains -d user -s "$keychain" "${keychain_paths[@]}"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security import "$certificate" -k "$keychain" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security > /dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          identities="$(security find-identity -v -p codesigning "$keychain")"
          printf '%s\n' "$identities"
          if ! printf '%s\n' "$identities" | grep -qE '^[[:space:]]*[1-9][0-9]*\) [[:xdigit:]]{40} "Apple Distribution:'; then
            echo "::error::The imported certificate must be an Apple Distribution identity with its private key."
            exit 1
          fi
          security cms -D -i "$profile" > "$profile_plist"
          profile_uuid="$(plutil -extract UUID raw -o - "$profile_plist")"
          profile_name="$(plutil -extract Name raw -o - "$profile_plist")"
          profile_team_id="$(plutil -extract TeamIdentifier.0 raw -o - "$profile_plist")"
          application_identifier="$(plutil -extract Entitlements.application-identifier raw -o - "$profile_plist")"
          if ! get_task_allow="$(plutil -extract Entitlements.get-task-allow raw -o - "$profile_plist")"; then
            echo "::error::The provisioning profile is missing get-task-allow."
            exit 1
          fi
          if plutil -extract ProvisionedDevices raw -o /dev/null "$profile_plist" > /dev/null 2>&1; then
            echo "::error::The provisioning profile contains devices; use an App Store profile."
            exit 1
          fi
          if [ "$(plutil -extract ProvisionsAllDevices raw -o - "$profile_plist" 2>/dev/null || true)" = "true" ]; then
            echo "::error::The provisioning profile allows all devices; use an App Store profile."
            exit 1
          fi
          bundle_id="${application_identifier#*.}"
          if [ "$profile_team_id" != "$APPLE_TEAM_ID" ]; then
            echo "::error::The provisioning profile team does not match APPLE_TEAM_ID."
            exit 1
          fi
          if [ "$bundle_id" != "com.prnice.expertListing" ]; then
            echo "::error::The provisioning profile is for $bundle_id, not com.prnice.expertListing."
            exit 1
          fi
          if [ "$get_task_allow" != "false" ]; then
            echo "::error::The provisioning profile allows debugging; use an App Store profile."
            exit 1
          fi
          profile_destination="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/${profile_uuid}.mobileprovision"
          mkdir -p "$(dirname "$profile_destination")"
          cp "$profile" "$profile_destination"
          printf '%s' "$profile_destination" > "$RUNNER_TEMP/ios-profile-path"
          printf '%s' "$profile_name" > "$RUNNER_TEMP/ios-profile-name"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${bundle_id}</key>
              <string>${profile_name}</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"
          echo "Using App Store profile: $profile_name"
      - name: Build the signed TestFlight IPA
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
        run: |
          expected_api_url='https://chvhwausefhvaceygppc.supabase.co/functions/v1/api'
          if [ "$PUBLIC_API_BASE_URL" != "$expected_api_url" ]; then
            echo "::error::PUBLIC_API_BASE_URL must equal $expected_api_url for a release build."
            exit 1
          fi
          profile_name="$(cat "$RUNNER_TEMP/ios-profile-name")"
          if [ -z "$profile_name" ]; then
            echo "::error::The App Store profile name is unavailable."
            exit 1
          fi
          export FLUTTER_XCODE_DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
          export FLUTTER_XCODE_CODE_SIGN_STYLE=Manual
          export FLUTTER_XCODE_CODE_SIGN_IDENTITY='Apple Distribution'
          export FLUTTER_XCODE_PROVISIONING_PROFILE_SPECIFIER="$profile_name"
          flutter build ipa --release --no-pub \
            --build-number "$GITHUB_RUN_NUMBER" \
            --export-options-plist "$RUNNER_TEMP/ExportOptions.plist" \
            --dart-define=API_BASE_URL="$PUBLIC_API_BASE_URL"
        working-directory: apps/expert_listing_mobile
      - name: Validate the IPA with App Store Connect
        env:
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/app-store-connect-private-keys
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          shopt -s nullglob
          ipas=(apps/expert_listing_mobile/build/ios/ipa/*.ipa)
          if [ "${#ipas[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one IPA in apps/expert_listing_mobile/build/ios/ipa."
            exit 1
          fi
          printf '%s' "${ipas[0]}" > "$RUNNER_TEMP/testflight-ipa-path"
          xcrun altool --validate-app "${ipas[0]}" \
            --type ios \
            --api-key "$APP_STORE_CONNECT_KEY_ID" \
            --api-issuer "$APP_STORE_CONNECT_ISSUER_ID"
      - name: Upload the IPA to App Store Connect
        env:
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/app-store-connect-private-keys
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          ipa="$(cat "$RUNNER_TEMP/testflight-ipa-path")"
          xcrun altool --upload-app -f "$ipa" \
            --type ios \
            --api-key "$APP_STORE_CONNECT_KEY_ID" \
            --api-issuer "$APP_STORE_CONNECT_ISSUER_ID"
      - name: Report completed upload
        run: |
          version="$(sed -n 's/^version: \([^+]*\).*/\1/p' apps/expert_listing_mobile/pubspec.yaml | head -1)"
          echo "Uploaded TestFlight build $GITHUB_RUN_NUMBER for Expert Listing $version."
          echo "App Store Connect now processes the upload; workflow success does not mean it is ready for testers."
      - name: Remove temporary signing and upload credentials
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/ios-original-keychains.txt" ]; then
            keychain_paths=()
            while IFS= read -r keychain_path; do
              keychain_paths+=("${keychain_path//\"/}")
            done < "$RUNNER_TEMP/ios-original-keychains.txt"
            if [ "${#keychain_paths[@]}" -gt 0 ]; then
              security list-keychains -d user -s "${keychain_paths[@]}" || true
            fi
          fi
          security delete-keychain "$RUNNER_TEMP/expert-listing-testflight.keychain-db" || true
          if [ -f "$RUNNER_TEMP/ios-profile-path" ]; then
            rm -f "$(cat "$RUNNER_TEMP/ios-profile-path")" || true
          fi
          rm -rf "$RUNNER_TEMP/app-store-connect-private-keys" || true
          rm -f "$RUNNER_TEMP/ios-distribution.p12" || true
          rm -f "$RUNNER_TEMP/appstore.mobileprovision" || true
          rm -f "$RUNNER_TEMP/appstore-profile.plist" || true
          rm -f "$RUNNER_TEMP/ios-original-keychains.txt" || true
          rm -f "$RUNNER_TEMP/ios-profile-path" || true
          rm -f "$RUNNER_TEMP/ios-profile-name" || true
          rm -f "$RUNNER_TEMP/ExportOptions.plist" || true
          rm -f "$RUNNER_TEMP/testflight-ipa-path" || true
