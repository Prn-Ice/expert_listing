name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The three named device journeys are separately required evidence. CI does not
# run or claim them.
jobs:
  flutter-checks:
    name: Flutter and Dart checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Restore the committed app_ui dependency graph
        run: flutter pub get --enforce-lockfile
        working-directory: packages/app_ui
      - name: Restore the committed mobile dependency graph
        run: flutter pub get --enforce-lockfile
        working-directory: apps/expert_listing_mobile
      - name: Verify app_ui formatting
        run: dart format --output=none --set-exit-if-changed .
        working-directory: packages/app_ui
      - name: Verify mobile formatting
        run: dart format --output=none --set-exit-if-changed .
        working-directory: apps/expert_listing_mobile
      - name: Analyze app_ui
        run: flutter analyze --no-pub
        working-directory: packages/app_ui
      - name: Analyze mobile
        run: flutter analyze --no-pub
        working-directory: apps/expert_listing_mobile
      - name: Run app_ui tests
        run: flutter test --no-pub
        working-directory: packages/app_ui
      - name: Run mobile tests
        run: flutter test --no-pub
        working-directory: apps/expert_listing_mobile

  backend-checks:
    name: Hono and Supabase checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.5
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.111.0
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Restore the committed API dependency graph
        run: deno ci
        working-directory: supabase/functions/api
      - name: Check formatting
        run: deno fmt --check supabase/functions
      - name: Lint
        run: deno lint supabase/functions
      - name: Type-check
        run: deno check --frozen index.ts tests/health_test.ts tests/feed_test.ts
        working-directory: supabase/functions/api
      - name: Apply migrations, deterministic seed and bucket fixtures
        run: |
          supabase start
          supabase db reset --local
          supabase seed buckets --local
      - name: Run pgTAP tests
        run: supabase test db --local
      - name: Run Hono API tests against the real local stack
        run: scripts/run-api-tests

  release-apk-probe:
    name: Release APK build probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Restore the committed mobile dependency graph
        run: flutter pub get --enforce-lockfile
        working-directory: apps/expert_listing_mobile
      - name: Create a disposable probe keystore
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/probe-release.jks" \
            -storetype PKCS12 \
            -alias probe-release \
            -keyalg RSA -keysize 2048 -validity 3 \
            -storepass probe-store-password -keypass probe-store-password \
            -dname "CN=Expert Listing CI Probe, OU=Probe, O=Expert Listing, L=Lagos, ST=Lagos, C=NG"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/probe-release.jks"
            printf '%s\n' 'storePassword=probe-store-password'
            printf '%s\n' 'keyAlias=probe-release'
            printf '%s\n' 'keyPassword=probe-store-password'
          } > apps/expert_listing_mobile/android/key.properties
      - name: Build a release APK with the disposable keystore
        run: flutter build apk --release
        working-directory: apps/expert_listing_mobile
      - name: Verify the APK is signed by the probe keystore
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          if [ -z "$apksigner" ]; then
            echo "::error::Could not find apksigner in the Android build tools."
            exit 1
          fi
          apk="apps/expert_listing_mobile/build/app/outputs/flutter-apk/app-release.apk"
          "$apksigner" verify "$apk"
          actual="$("$apksigner" verify --print-certs "$apk" \
            | sed -n 's/.*SHA-256 digest: //p' | head -1 | tr -d ' :' | tr 'A-F' 'a-f')"
          expected="$(keytool -list -v \
            -keystore "$RUNNER_TEMP/probe-release.jks" \
            -storepass probe-store-password \
            | sed -n 's/.*SHA256: //p' | head -1 | tr -d ' :' | tr 'A-F' 'a-f')"
          echo "APK signer SHA-256: $actual"
          echo "Probe keystore SHA-256: $expected"
          test -n "$actual" && test "$actual" = "$expected"
      - name: Remove disposable Android signing material
        if: ${{ always() }}
        run: rm -f apps/expert_listing_mobile/android/key.properties "$RUNNER_TEMP/probe-release.jks"
